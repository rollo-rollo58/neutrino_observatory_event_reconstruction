apiVersion: apps/v1
kind: Deployment
metadata:
  name: borealis-research-api
  labels:
    app: borealis-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: borealis-api
  template:
    metadata:
      labels:
        app: borealis-api
    spec:
      containers:
        - name: api
          image: example.invalid/borealis-api:replace-before-deployment
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: borealis-research-api
spec:
  selector:
    app: borealis-api
  ports:
    - port: 80
      targetPort: 8000
