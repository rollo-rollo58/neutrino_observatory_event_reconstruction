services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neutrino_demo
      POSTGRES_USER: observatory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set the password in your shell}
    ports:
      - '5432:5432'
    volumes:
      - neutrino_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U observatory -d neutrino_demo']
      interval: 10s
      timeout: 3s
      retries: 8
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: demonstration
      ALLOWED_ORIGINS: http://localhost:3000
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
    ports:
      - '8000:8000'
    depends_on:
      database:
        condition: service_healthy
  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c 'npm install && npm run dev -- --hostname 0.0.0.0'
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/workspace
    ports:
      - '3000:3000'
    depends_on:
      - api
volumes:
  neutrino_data:
